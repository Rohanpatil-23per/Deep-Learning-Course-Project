<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1660" viewBox="0 0 2400 1660" role="img" aria-labelledby="title desc">
  <title id="title">IMMUNEX complete system architecture</title>
  <desc id="desc">End-to-end architecture for the IMMUNEX five-layer threat detection and response system, including UI, ingestion, orchestration, AI layers, data services, approvals, feedback, local runtime, and distributed deployment.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:36px;font-weight:700}.subtitle{font-size:17px;fill:#526174}.zone{font-size:18px;font-weight:700;letter-spacing:1.2px}.box-title{font-size:19px;font-weight:700}.box-text{font-size:14px;fill:#334155}.small{font-size:12px;fill:#526174}.port{font-size:12px;font-weight:700;fill:#334155}.line{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.feedback{fill:none;stroke:#0f766e;stroke-width:2.2;stroke-dasharray:6 5;marker-end:url(#arrowTeal)}.flow-label{font-size:12px;font-weight:700;fill:#526174}.box{stroke-width:1.8}.shadow{filter:url(#shadow)}</style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker>
  </defs>
  <rect width="2400" height="1660" fill="#f8fafc"/>
  <text x="60" y="58" class="title">IMMUNEX — Complete System Architecture &amp; Threat-Response Flow</text>
  <text x="60" y="86" class="subtitle">Five-layer adaptive security platform for financial environments · production microservice topology + single-laptop simulation</text>

  <!-- entry zone -->
  <rect x="45" y="115" width="2310" height="175" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="70" y="145" class="zone" fill="#1d4ed8">1 · USERS, TELEMETRY &amp; PRESENTATION</text>
  <g class="shadow"><rect class="box" x="80" y="165" width="290" height="92" rx="10" fill="#fff" stroke="#60a5fa"/><text x="100" y="194" class="box-title">Security analysts / SOC</text><text x="100" y="217" class="box-text">Review incidents · approve actions</text><text x="100" y="239" class="box-text">Monitor verdicts, chains and metrics</text></g>
  <g class="shadow"><rect class="box" x="460" y="165" width="330" height="92" rx="10" fill="#fff" stroke="#60a5fa"/><text x="480" y="194" class="box-title">React + Vite dashboard</text><text x="480" y="217" class="box-text">Dashboard · Detect · Alerts · Attack Graph</text><text x="480" y="239" class="box-text">Playbook · AI engine · Reports</text></g>
  <g class="shadow"><rect class="box" x="885" y="165" width="395" height="92" rx="10" fill="#fff" stroke="#60a5fa"/><text x="905" y="194" class="box-title">Event sources</text><text x="905" y="217" class="box-text">SIEM / EDR · firewall · NetFlow · auth</text><text x="905" y="239" class="box-text">Syslog · CEF/LEEF · JSON · CSV · Windows XML</text></g>
  <g class="shadow"><rect class="box" x="1395" y="165" width="390" height="92" rx="10" fill="#fff" stroke="#60a5fa"/><text x="1415" y="194" class="box-title">Training &amp; evaluation data</text><text x="1415" y="217" class="box-text">CICIDS 2017/2018 · UNSW-NB15 · NSL-KDD</text><text x="1415" y="239" class="box-text">Raw logs / feature datasets / scenarios</text></g>
  <g class="shadow"><rect class="box" x="1900" y="165" width="400" height="92" rx="10" fill="#fff" stroke="#60a5fa"/><text x="1920" y="194" class="box-title">Deployment control plane</text><text x="1920" y="217" class="box-text">Docker Compose · start scripts · health checks</text><text x="1920" y="239" class="box-text">WireGuard mesh for distributed nodes</text></g>

  <!-- gateway zone -->
  <rect x="45" y="320" width="2310" height="240" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="70" y="350" class="zone" fill="#6d28d9">2 · API GATEWAY, BULK INGESTION &amp; ORCHESTRATION — FastAPI :8000</text>
  <g class="shadow"><rect class="box" x="90" y="375" width="440" height="145" rx="10" fill="#fff" stroke="#8b5cf6"/><text x="112" y="405" class="box-title">Orchestrator</text><text x="112" y="430" class="box-text">POST /pipeline/run · /demo/inject · /metrics</text><text x="112" y="453" class="box-text">Rate limiter · per-layer timeouts · CORS</text><text x="112" y="476" class="box-text">Circuit breaker · automatic URL failover · metrics</text><text x="112" y="499" class="box-text">Unified final verdict + pipeline ID</text></g>
  <g class="shadow"><rect class="box" x="620" y="375" width="490" height="145" rx="10" fill="#fff" stroke="#8b5cf6"/><text x="642" y="405" class="box-title">Ingest API</text><text x="642" y="430" class="box-text">POST /ingest/stream · /ingest/batch</text><text x="642" y="453" class="box-text">Normalize formats → Alert schema</text><text x="642" y="476" class="box-text">Redis de-duplicate · priority/triage queue</text><text x="642" y="499" class="box-text">Distributed L1 fan-out in GPU batches (default 32)</text></g>
  <g class="shadow"><rect class="box" x="1200" y="375" width="470" height="145" rx="10" fill="#fff" stroke="#8b5cf6"/><text x="1222" y="405" class="box-title">Relevance gate</text><text x="1222" y="430" class="box-text">Benign → persist &amp; return</text><text x="1222" y="453" class="box-text">Noise / duplicate → FILTERED</text><text x="1222" y="476" class="box-text">Novel / high-confidence → pipeline + playbook</text><text x="1222" y="499" class="box-text">Controls L4 retraining and L5 invocation</text></g>
  <g class="shadow"><rect class="box" x="1760" y="375" width="520" height="145" rx="10" fill="#fff" stroke="#8b5cf6"/><text x="1782" y="405" class="box-title">Shared contracts &amp; transport security</text><text x="1782" y="430" class="box-text">Pydantic Alert / AnomalyResult / AttackGraph schemas</text><text x="1782" y="453" class="box-text">HTTP between services; Layer 5 can use mTLS</text><text x="1782" y="476" class="box-text">Health: /health · mesh status: /mesh/status</text><text x="1782" y="499" class="box-text">Primary + fallback URLs per layer</text></g>

  <!-- layers -->
  <rect x="45" y="590" width="2310" height="610" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="70" y="620" class="zone" fill="#0f766e">3 · AI SECURITY PIPELINE — INDEPENDENT FASTAPI MICROSERVICES</text>
  <g class="shadow"><rect class="box" x="85" y="655" width="400" height="440" rx="12" fill="#fff" stroke="#14b8a6"/><text x="108" y="688" class="box-title">L1 — Detection :8001</text><text x="108" y="713" class="port">POST /detect · /detect_raw · /ingest</text><line x1="108" y1="726" x2="460" y2="726" stroke="#cbd5e1"/>
  <text x="108" y="752" class="box-text">Raw parser / normalizer</text><text x="108" y="776" class="box-text">RoBERTa embedding (768-D)</text><text x="108" y="800" class="box-text">FAISS nearest-neighbour novelty search</text><text x="108" y="824" class="box-text">Isolation Forest anomaly inference</text><text x="108" y="848" class="box-text">Optional GATv2 / AutoEncoder models</text><text x="108" y="880" class="box-text">Outputs:</text><text x="125" y="903" class="small">anomaly score · confidence · attack type</text><text x="125" y="923" class="small">embedding · CICIDS 77-feature vector</text><text x="125" y="943" class="small">source/destination metadata</text><text x="108" y="984" class="box-text">Known-attack feedback → FAISS index</text><text x="108" y="1022" class="small">Ollama playbook fallback is available here</text><text x="108" y="1050" class="small">Models: local artifacts / models/</text></g>
  <g class="shadow"><rect class="box" x="540" y="655" width="400" height="440" rx="12" fill="#fff" stroke="#14b8a6"/><text x="563" y="688" class="box-title">L2 — Correlation :8002</text><text x="563" y="713" class="port">POST /correlate</text><line x1="563" y1="726" x2="915" y2="726" stroke="#cbd5e1"/>
  <text x="563" y="752" class="box-text">50-alert sequence window</text><text x="563" y="776" class="box-text">Graph builder + GATv2 graph scoring</text><text x="563" y="800" class="box-text">Transformer spatial encoder</text><text x="563" y="824" class="box-text">BiLSTM narrative tracker</text><text x="563" y="848" class="box-text">HMM next-stage predictor</text><text x="563" y="880" class="box-text">Outputs:</text><text x="580" y="903" class="small">attack graph (nodes / edges / weights)</text><text x="580" y="923" class="small">MITRE ATT&amp;CK stage</text><text x="580" y="943" class="small">predicted next stage · confidence</text><text x="563" y="984" class="box-text">Feeds correlated features to L3</text><text x="563" y="1022" class="small">Artifacts: GATv2 + BiLSTM checkpoints</text></g>
  <g class="shadow"><rect class="box" x="995" y="655" width="400" height="440" rx="12" fill="#fff" stroke="#14b8a6"/><text x="1018" y="688" class="box-title">L3 — Response Engine :8003</text><text x="1018" y="713" class="port">POST /respond · /approve/{alert_id}</text><line x1="1018" y1="726" x2="1370" y2="726" stroke="#cbd5e1"/>
  <text x="1018" y="752" class="box-text">Dueling DQN action policy</text><text x="1018" y="776" class="box-text">Z3 formal safety verifier</text><text x="1018" y="800" class="box-text">LLM reasoning (Ollama / llama3.1:8b)</text><text x="1018" y="824" class="box-text">Priority queue + human approval gate</text><text x="1018" y="848" class="box-text">Action executor (dry-run by default)</text><text x="1018" y="880" class="box-text">Actions:</text><text x="1035" y="903" class="small">do_nothing · monitor · block · isolate</text><text x="1018" y="942" class="box-text">Auto-executes low-risk safe actions</text><text x="1018" y="966" class="box-text">High / uncertain actions await analyst</text><text x="1018" y="1022" class="small">Audit logger + pgvector incident-memory integration</text></g>
  <g class="shadow"><rect class="box" x="1450" y="655" width="400" height="440" rx="12" fill="#fff" stroke="#14b8a6"/><text x="1473" y="688" class="box-title">L4 — Immunity :8004</text><text x="1473" y="713" class="port">POST /predict · /retrain</text><line x1="1473" y1="726" x2="1825" y2="726" stroke="#cbd5e1"/>
  <text x="1473" y="752" class="box-text">77-feature CICIDS representation</text><text x="1473" y="776" class="box-text">Logistic Regression base classifier</text><text x="1473" y="800" class="box-text">LoRA adapters</text><text x="1473" y="824" class="box-text">EWC continual-learning protection</text><text x="1473" y="856" class="box-text">Outputs:</text><text x="1490" y="879" class="small">Benign / Attack prediction</text><text x="1490" y="899" class="small">severity: Low → Critical</text><text x="1473" y="938" class="box-text">High-confidence events trigger background</text><text x="1473" y="962" class="box-text">retraining without catastrophic forgetting</text><text x="1473" y="1022" class="small">Checkpoints: lora_model_ewc.pt</text></g>
  <g class="shadow"><rect class="box" x="1905" y="655" width="400" height="440" rx="12" fill="#fff" stroke="#14b8a6"/><text x="1928" y="688" class="box-title">L5 — Threat Memory :8005</text><text x="1928" y="713" class="port">POST /explain (= /predict) · mTLS</text><line x1="1928" y1="726" x2="2280" y2="726" stroke="#cbd5e1"/>
  <text x="1928" y="752" class="box-text">Persistent chain &amp; attacker profiles</text><text x="1928" y="776" class="box-text">SQLite: chains / observations / predictions</text><text x="1928" y="800" class="box-text">LSTM progression predictor</text><text x="1928" y="824" class="box-text">Categorical HMM state inference</text><text x="1928" y="856" class="box-text">Outputs:</text><text x="1945" y="879" class="small">current kill-chain state · risk</text><text x="1945" y="899" class="small">next observation / threat prediction</text><text x="1945" y="919" class="small">playbook recommendation · confidence</text><text x="1928" y="958" class="box-text">Disagreement escalation to SOC</text><text x="1928" y="1022" class="small">GET /chains · /chain/{id} · /attacker/{ip}</text></g>

  <!-- data and ops zone -->
  <rect x="45" y="1230" width="2310" height="340" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="70" y="1260" class="zone" fill="#c2410c">4 · STATE, EVENTING, AUDIT, OBSERVABILITY &amp; DEPLOYMENT</text>
  <g class="shadow"><rect class="box" x="90" y="1290" width="350" height="210" rx="10" fill="#fff" stroke="#fb923c"/><text x="112" y="1320" class="box-title">Kafka + Zookeeper</text><text x="112" y="1345" class="box-text">Event topics:</text><text x="128" y="1368" class="small">raw_alerts · anomaly_results</text><text x="128" y="1388" class="small">attack_graphs · responses · playbooks</text><text x="112" y="1425" class="box-text">Kafka UI :8080 for debugging</text><text x="112" y="1460" class="small">Docker service :9092 / :29092</text></g>
  <g class="shadow"><rect class="box" x="505" y="1290" width="350" height="210" rx="10" fill="#fff" stroke="#fb923c"/><text x="527" y="1320" class="box-title">Redis :6379</text><text x="527" y="1345" class="box-text">Anomaly + embedding cache</text><text x="527" y="1368" class="box-text">IOC TTL list · IP alert counters</text><text x="527" y="1391" class="box-text">Ingest de-duplication</text><text x="527" y="1414" class="box-text">Pub/sub dashboard updates</text><text x="527" y="1460" class="small">append-only Docker volume</text></g>
  <g class="shadow"><rect class="box" x="920" y="1290" width="350" height="210" rx="10" fill="#fff" stroke="#fb923c"/><text x="942" y="1320" class="box-title">Elasticsearch :9200</text><text x="942" y="1345" class="box-text">Indexes:</text><text x="958" y="1368" class="small">immunex_alerts</text><text x="958" y="1388" class="small">immunex_incidents</text><text x="958" y="1408" class="small">immunex_playbooks</text><text x="942" y="1460" class="small">Persistent ES Docker volume</text></g>
  <g class="shadow"><rect class="box" x="1335" y="1290" width="420" height="210" rx="10" fill="#fff" stroke="#fb923c"/><text x="1357" y="1320" class="box-title">Audit &amp; model storage</text><text x="1357" y="1345" class="box-text">L3 JSONL immutable audit logs</text><text x="1357" y="1368" class="box-text">L5 SQLite threat_memory.db</text><text x="1357" y="1391" class="box-text">Local simulation: local_incidents.db</text><text x="1357" y="1414" class="box-text">FAISS index + PyTorch / sklearn weights</text><text x="1357" y="1460" class="small">Model artifacts and training scripts retained in repo</text></g>
  <g class="shadow"><rect class="box" x="1820" y="1290" width="480" height="210" rx="10" fill="#fff" stroke="#fb923c"/><text x="1842" y="1320" class="box-title">Deployment modes</text><text x="1842" y="1345" class="box-text">Production: services :8001–:8005 + orchestrator :8000</text><text x="1842" y="1368" class="box-text">Distributed: WireGuard nodes with L2–L5 fallback URLs</text><text x="1842" y="1391" class="box-text">Local: React dist → local_runtime :8000 (simulation)</text><text x="1842" y="1414" class="box-text">Local runtime: L1 FAISS/Isolation Forest + L2 graph, optional L4/L5</text><text x="1842" y="1460" class="small">No Docker / Ollama / containment needed in local mode</text></g>

  <!-- main data-flow arrows -->
  <path class="line" d="M370 211 H460"/><text x="386" y="201" class="flow-label">HTTPS</text>
  <path class="line" d="M790 211 H885"/><text x="807" y="201" class="flow-label">submit / view</text>
  <path class="line" d="M1080 257 V375 H310"/><text x="970" y="355" class="flow-label">raw logs</text>
  <path class="line" d="M625 257 V375 H310"/><text x="538" y="355" class="flow-label">API calls</text>
  <path class="dash" d="M1590 257 V342 H2050 V375"/><text x="1650" y="332" class="flow-label">train / deploy models</text>
  <path class="line" d="M530 447 H620"/><text x="544" y="438" class="flow-label">normalized alerts</text>
  <path class="line" d="M310 520 V635 H285 V655"/><text x="326" y="610" class="flow-label">single alert / batch</text>
  <path class="line" d="M485 875 H540"/><text x="495" y="865" class="flow-label">anomalous alert + embedding</text>
  <path class="line" d="M485 820 H1450"/><text x="1090" y="809" class="flow-label">77-D CICIDS features (parallel L4 call)</text>
  <path class="line" d="M940 875 H995"/><text x="950" y="865" class="flow-label">attack graph + MITRE stage</text>
  <path class="line" d="M1395 875 H1905"/><text x="1605" y="865" class="flow-label">verified action / chain context</text>
  <path class="feedback" d="M1650 1095 V1150 H285 V1095"/><text x="880" y="1142" class="flow-label" fill="#0f766e">continual-learning / confirmed-attack feedback: L3 &amp; orchestrator → L4 retrain; L1 FAISS attack index</text>
  <path class="line" d="M1195 1095 V1230 H265 V1290"/><text x="545" y="1218" class="flow-label">playbook events</text>
  <path class="line" d="M310 520 V1230 H680 V1290"/><text x="390" y="1218" class="flow-label">cache / dedup / pub-sub</text>
  <path class="line" d="M360 520 V1230 H1095 V1290"/><text x="770" y="1218" class="flow-label">alerts / incidents / playbooks</text>
  <path class="dash" d="M1195 1095 V1165 H1545 V1290"/><text x="1285" y="1155" class="flow-label">audit decisions</text>
  <path class="dash" d="M2105 655 V565 H2200 V520"/><text x="2120" y="555" class="flow-label">mTLS certificates</text>
  <path class="line" d="M1195 1095 V1175 H225 V1290"/><text x="570" y="1165" class="flow-label">response / playbook</text>
  <path class="line" d="M225 1290 V1190 H225 V257"/><text x="241" y="1180" class="flow-label">live status &amp; results</text>
  <path class="line" d="M1195 1095 V1130 H1510 V257"/><text x="1524" y="1130" class="flow-label">human approval / execute</text>

  <rect x="65" y="1588" width="2270" height="42" rx="8" fill="#e2e8f0"/>
  <text x="85" y="1614" class="small">Legend: solid arrows = synchronous API/data flow · dashed arrows = operational, training or security path · teal dashed arrows = adaptive feedback loop.  The production flow fans anomalous alerts from L1 to L2 and L4 in parallel, then L3, then L5; benign, noisy and duplicate events exit earlier.</text>
</svg>
